name: frontend

# pull_request 에는 paths 필터를 두지 않는다.
# 필터에 걸려 워크플로가 안 돌면 required status check 는 "보고 대기" 로 영원히 멈춘다.
# 09-07 에 backend 만 바꾼 PR 이 그렇게 막혔다. push 에는 필터를 남긴다 —
# 거기서는 required check 판정이 없고 관계없는 커밋으로 러너를 쓸 이유도 없다.
on:
  push:
    branches: [dev, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [dev, main]

# 같은 브랜치에서 새 푸시가 오면 이전 실행을 취소한다
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  frontend-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # validate:data → check:i18n → lint → build
      - name: verify
        run: npm run verify

      # 무음 catch 검사 — 회고 4-6 "조용히 망가지는 것" 방지
      # API 오류를 빈 데이터로 바꾸는 코드를 막는다 (CLAUDE.md 프론트엔드 규칙)
      - name: 무음 catch 검사
        run: |
          # 주석 줄(// 또는 *)은 제외한다 — 규칙을 설명하는 주석이 규칙에 걸리면 안 된다
          filter_comments() { grep -vE '^[^:]+:[0-9]+:\s*(//|\*|/\*)' || true; }

          echo "빈 catch 블록 검사"
          hits=$(grep -rnE 'catch\s*(\([^)]*\))?\s*\{\s*\}' src --include='*.js' --include='*.jsx' | filter_comments)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::빈 catch 블록이 있습니다. 오류를 UI에 노출하거나 최소한 로깅하세요."
            exit 1
          fi

          echo "오류를 빈 데이터로 바꾸는 catch 검사"
          hits=$(grep -rnE '\.catch\(\s*\(\s*\)\s*=>\s*(null|undefined|\[\]|\{\})\s*\)' src --include='*.js' --include='*.jsx' | filter_comments)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::오류를 빈 데이터로 바꾸고 있습니다. EmptyState 로 위장됩니다."
            exit 1
          fi
          echo "통과"

      # 문서 참조 정합성 — NEXT_STEPS 1장 순서표 재번호가 다른 파일 참조까지 어긋나게 하는 것을 막는다
      # 09-09 PR #37 에서 자가체크 PASS 로 통과한 20곳을 사람이 잡은 실패를 기계로 옮긴 검사
      - name: 문서 참조 정합성
        working-directory: .
        run: node scripts/check-doc-refs.mjs
