<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>PitchLog — 7단계 알림</title>
<link rel="stylesheet" href="_ds/wanted-design-system-200007bd-2f8a-4860-8223-df59d980c040/tokens/fonts.css">
<link rel="stylesheet" href="_ds/wanted-design-system-200007bd-2f8a-4860-8223-df59d980c040/tokens/fig-tokens.css">
<link rel="stylesheet" href="_ds/wanted-design-system-200007bd-2f8a-4860-8223-df59d980c040/tokens/fig-typography.css">
<link rel="stylesheet" href="_ds/wanted-design-system-200007bd-2f8a-4860-8223-df59d980c040/tokens/typography.css">
<link rel="stylesheet" href="_ds/wanted-design-system-200007bd-2f8a-4860-8223-df59d980c040/tokens/aliases.css">
<link rel="stylesheet" href="_ds/wanted-design-system-200007bd-2f8a-4860-8223-df59d980c040/components/core/fig-assets.css">
<link rel="stylesheet" href="_ds/wanted-design-system-200007bd-2f8a-4860-8223-df59d980c040/styles.css">
<link rel="stylesheet" href="pitchlog.css">
<style>body{margin:0;background:#EBECEE;font-family:var(--font)}
.wrap{display:flex;gap:28px;flex-wrap:wrap;padding:20px 32px 48px;align-items:flex-start}
.ab{display:grid;gap:8px}
.ab h4{margin:0;font-size:14px;font-weight:700}
.ab p{margin:0;font-size:12px;line-height:1.6;opacity:.7;max-width:var(--w)}
h3.sec{margin:0;padding:26px 32px 0;font-size:18px;font-weight:700}
</style></head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/wanted-design-system-200007bd-2f8a-4860-8223-df59d980c040/_ds_bundle.js"></script>
<script type="text/babel" src="pitchlog-kit.jsx"></script>
<script type="text/babel" src="parts-2.jsx"></script>
<script type="text/babel" src="notif-7.jsx"></script>
<script type="text/babel">
const {useState,useEffect}=React;
function Art({item,theme,onOpen}){
  const el=item.render(theme);
  return <div className="ab" style={{"--w":item.w*item.s+"px"}}>
    <h4>{item.label}</h4>
    <div className="scr-btn" role="button" tabIndex={0} onClick={()=>onOpen({...item,el})} onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onOpen({...item,el})}}} aria-label={item.label+" 크게 보기"}>
      <div className="frame" style={{width:item.w*item.s,height:item.h*item.s}}>
        <div className="scaler" ref={n=>{if(n)n.setAttribute("inert","")}} aria-hidden="true" style={{transform:`scale(${item.s})`,width:item.w,height:item.h,pointerEvents:"none"}}>{el}</div>
      </div>
    </div>
    {item.note&&<p>{item.note}</p>}
  </div>;
}
function Lightbox({item,close}){
  const [s,setS]=useState(1);
  useEffect(()=>{
    const fit=()=>setS(Math.min((window.innerHeight-110)/item.h,(window.innerWidth-64)/item.w,1));
    fit();window.addEventListener("resize",fit);
    const k=e=>{if(e.key==="Escape")close()};window.addEventListener("keydown",k);
    return()=>{window.removeEventListener("resize",fit);window.removeEventListener("keydown",k)};
  },[item]);
  return <div className="ov" onClick={e=>{if(e.target.classList.contains("ov")||e.target.classList.contains("ovbody"))close()}} style={{position:"fixed",inset:0,zIndex:50,background:"rgba(10,10,12,.74)",display:"grid",gridTemplateRows:"auto 1fr"}}>
    <div style={{display:"flex",alignItems:"center",gap:12,padding:"14px 20px",color:"#fff",fontSize:14}}>
      <b>{item.label}</b><span style={{opacity:.7}}>{item.w}×{item.h}</span>
      <button onClick={close} style={{marginLeft:"auto",font:"600 13px/1 var(--font)",padding:"9px 14px",borderRadius:8,border:"1px solid rgba(255,255,255,.28)",background:"rgba(255,255,255,.08)",color:"#fff",cursor:"pointer"}}>닫기 (Esc)</button>
    </div>
    <div className="ovbody" style={{display:"grid",placeItems:"center",overflow:"auto",padding:"0 20px 24px"}}>
      <div className="frame" style={{width:item.w*s,height:item.h*s}}><div className="scaler" style={{transform:`scale(${s})`,width:item.w,height:item.h}}>{item.el}</div></div>
    </div>
  </div>;
}
const A=[
 {label:"1. 토스트 4종",w:440,h:640,s:.72,render:t=><ToastSheet theme={t}/>,
  note:"골·킥오프·종료는 진행 막대와 함께 자동으로 사라지고, 확정만 좌측 초록 표시선 + 체크 아이콘 + 수동 닫기입니다."},
 {label:"2. 토스트 다중 스택 (데스크톱)",w:1440,h:900,s:.44,render:t=><NotiDesktop theme={t} mode="toast"/>,
  note:"동시에 최대 3개, 그 이상은 “가려진 알림 N건”으로 접습니다. 확정이 항상 맨 위."},
 {label:"3. 헤더 벨 — 0 / 3 / 99+",w:440,h:330,s:.72,render:t=><BellSheet theme={t}/>,
  note:"개수 배지는 브랜드 파랑 채움. 빨강은 LIVE·오류 전용이라 쓰지 않습니다."},
 {label:"4. 알림 패널 (내용 있음)",w:1440,h:900,s:.44,render:t=><NotiDesktop theme={t} mode="panel"/>,
  note:"안 읽음은 좌측 점 + 옅은 배경 + 굵은 제목. 하단에 알림 설정과 “이 브라우저에만 저장됩니다”."},
 {label:"5. 알림 패널 (비어 있음)",w:1440,h:900,s:.44,render:t=><NotiDesktop theme={t} mode="empty"/>,
  note:"첫 방문자가 보는 화면. 벨 배지도 사라집니다."},
 {label:"6. 권한 요청 카드 (1단계)",w:1440,h:900,s:.44,render:t=><NotiDesktop theme={t} mode="perm"/>,
  note:"브라우저 권한 창을 바로 띄우지 않습니다. “알림 받기”를 눌렀을 때만 OS 창을 엽니다."},
 {label:"7. 알림 설정 · 아직 안 물어봄",w:1440,h:1000,s:.44,render:t=><NotiSettings theme={t} perm="idle"/>,
  note:"관심 팀 / 관심 대회 / 어떤 일이 / 어디로 4블록. 제목 옆에 “이 브라우저에서만 적용됩니다”."},
 {label:"8. 알림 설정 · 허용됨",w:1440,h:1000,s:.44,render:t=><NotiSettings theme={t} perm="granted"/>},
 {label:"9. 알림 설정 · 거부됨",w:1440,h:1000,s:.44,render:t=><NotiSettings theme={t} perm="denied"/>,
  note:"막다른 길을 만들지 않습니다 — 브라우저에서 되돌리는 방법과 “인앱 알림만 쓰기” 대안을 함께 둡니다."},
 {label:"10. 알림 목록 · 모바일",w:390,h:844,s:.62,render:t=><NotiMobile theme={t} mode="panel"/>},
 {label:"11. 알림 목록 · 모바일 비어 있음",w:390,h:844,s:.62,render:t=><NotiMobile theme={t} mode="empty"/>},
 {label:"12. 알림 설정 · 모바일 (거부됨)",w:390,h:844,s:.62,render:t=><NotiMobile theme={t} mode="denied"/>},
 {label:"13. 푸시 문구 규칙",w:440,h:420,s:.72,render:t=><PushSheet theme={t}/>,
  note:"제목에 스코어를 넣어 알림창만 봐도 알 수 있게 하고, 같은 경기는 tag로 교체합니다."}
];
function App(){
  const [theme,setTheme]=useState("light");
  const [lb,setLb]=useState(null);
  return <div>
    <div style={{position:"sticky",top:0,zIndex:10,display:"flex",gap:12,alignItems:"center",padding:"14px 32px",background:"rgba(235,236,238,.9)",backdropFilter:"blur(8px)",borderBottom:"1px solid rgba(112,115,124,.22)"}}>
      <b style={{fontSize:16}}>PitchLog · 7단계 알림</b>
      <span style={{fontSize:13,opacity:.65}}>인앱 토스트 · 벨 · 패널 · 권한 2단계 · 설정 · 푸시 문구</span>
      <span style={{marginLeft:"auto",display:"flex",gap:2,padding:3,borderRadius:999,background:"rgba(112,115,124,.16)"}}>
        {[["light","라이트"],["dark","다크"]].map(([k,l])=><button key={k} onClick={()=>setTheme(k)} aria-pressed={theme===k} style={{border:0,padding:"7px 14px",borderRadius:999,cursor:"pointer",font:"600 13px/1 var(--font)",background:theme===k?"#3366FF":"transparent",color:theme===k?"#fff":"#171719"}}>{l}</button>)}
      </span>
    </div>
    <div className="wrap">{A.map(it=><Art key={it.label} item={it} theme={theme} onOpen={setLb}/>)}</div>
    {lb&&<Lightbox item={lb} close={()=>setLb(null)}/>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
